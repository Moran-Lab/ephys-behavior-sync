# Create with:  conda env create -f environment.yml
# Versions are left open while the code is being written; they get pinned when v0.1 is tagged.
name: ephys-behavior-sync
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - statsmodels
  - matplotlib
  - pytest
  - jupyter
  - pip
  - pip:
      - nbstripout
      - -e .
